<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Level Test A1–C2</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bar:#e5e7eb;--fill:#0f172a;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--chip:#f1f5f9;--shadow:0 10px 30px rgba(15,23,42,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--ink:#f1f5f9;--mute:#94a3b8;--line:#2a3750;--bar:#2a3750;--fill:#f1f5f9;--okbg:#14352368;--badbg:#4c1d1d88;--chip:#222f47;--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#162033;--ink:#f1f5f9;--mute:#94a3b8;--line:#2a3750;--bar:#2a3750;--fill:#f1f5f9;--okbg:#14352368;--badbg:#4c1d1d88;--chip:#222f47;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center;padding:64px 16px 32px}
#theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:20px;cursor:pointer;z-index:5}
.card{width:100%;max-width:440px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:24px 20px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px}
.top span:last-child{color:var(--mute)}
.bar{height:8px;background:var(--bar);border-radius:99px;margin:12px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fill);border-radius:99px;transition:width .5s ease}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.chip{background:var(--chip);padding:5px 12px;border-radius:99px;font-weight:600;font-size:13px;color:var(--ink)}
h1{font-size:30px;margin:0 0 8px;letter-spacing:-.5px}
h2.q{font-size:24px;line-height:1.3;margin:20px 0 20px;letter-spacing:-.3px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;font-size:17px;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;font-size:15px;line-height:1.45}
.fb strong{display:block;margin-bottom:4px;font-size:16px}
.fb.ok{background:var(--okbg)}.fb.ok strong{color:var(--ok)}
.fb.bad{background:var(--badbg)}.fb.bad strong{color:var(--bad)}
.btn{display:block;width:100%;min-height:56px;margin-top:16px;border:0;border-radius:18px;background:var(--fill);color:var(--bg);font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--chip);color:var(--ink)}
.center{text-align:center}
.sub{color:var(--mute);font-size:17px;margin:0 0 6px}
.big{font-size:56px;margin:8px 0 12px}
.ring{position:relative;width:170px;height:170px;margin:20px auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .t{stroke:var(--bar)}
.ring .f{stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring div{position:absolute;inset:0;display:grid;place-content:center;font-size:32px;font-weight:800}
.ring small{font-size:13px;font-weight:600;color:var(--mute);text-align:center;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:var(--chip);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:13px;color:var(--mute)}
.level{display:inline-block;padding:8px 18px;border-radius:99px;font-weight:700;background:var(--chip)}
h3{margin:24px 0 10px;font-size:17px}
.miss{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.45}
.miss p{margin:0 0 6px;font-weight:600}
.miss .r{color:var(--bad)}.miss .g{color:var(--ok)}.miss em{display:block;margin-top:6px;color:var(--mute);font-style:normal;font-size:14px;background:rgba(0,0,0,0.03);padding:8px;border-radius:8px}
.inp{width:100%;min-height:56px;border:2px solid var(--line);border-radius:18px;padding:0 16px;font-size:17px;background:var(--card);color:var(--ink);font-family:inherit;margin-top:8px}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:600}
.who button{border:0;background:var(--chip);color:var(--ink);border-radius:99px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.h{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.h span:last-child{color:var(--mute);text-align:right}
</style>
</head>

function saveDB(){try{localStorage.setItem('a1db',JSON.stringify(DB));}catch(e){}}
const U=()=>DB.users[DB.cur];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmt(t){try{return new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

function profiles(){
  const names=Object.keys(DB.users);
  card.innerHTML='<div class="center"><div class="big">👤</div><h1>Профайл</h1><p class="sub" style="font-size:15px">Дүнгээ хадгалахын тулд профайл үүсгээрэй</p></div><input id="nm" class="inp" maxlength="20" placeholder="Нэрээ оруулна уу" autocomplete="off"><button class="btn" id="mk">Профайл Үүсгэх</button>'+
   (names.length?'<h3>Хадгалсан профайлууд</h3><div class="opts">'+names.map(n=>'<button class="opt" data-n="'+esc(n)+'"><b>👤</b><span>'+esc(n)+'</span></button>').join('')+'</div>':'');
  const pick=n=>{DB.cur=n;saveDB();home();};
  document.getElementById('mk').onclick=()=>{
    const n=document.getElementById('nm').value.trim();if(!n)return;
    if(!DB.users[n])DB.users[n]={best:{},hist:[],prog:null,seen:[]};
    pick(n);};
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.n));
}

function home(){
  if(!DB.cur||!DB.users[DB.cur])return profiles();
  const u=U();
  if(!u.seen) u.seen = []; // Асуултын түүх хадгалах жагсаалт
  
  let h='<div class="who"><span>👤 '+esc(DB.cur)+'</span><button id="sw">Солих</button></div><div class="center"><h1>English Level Test</h1><p class="sub" style="font-size:15px;margin-bottom:16px">Түвшингөө сонгоно уу</p></div>';
  if(u.prog)h+='<button class="btn" id="res" style="margin:0 0 14px">▶ Үргэлжлүүлэх '+u.prog.lvl+' · Асуулт '+(u.prog.i+1)+'/'+u.prog.quiz.length+'</button>';
  h+='<div class="opts">';
  Object.keys(L).forEach(k=>{const b=u.best[k];
    h+='<button class="opt" data-l="'+k+'"><b style="width:44px;border-radius:12px">'+k+'</b><span>'+LV[k]+'<br><small style="color:var(--mute)">30 асуулт'+(b!==undefined?' · Сайн оноо: '+b+'/'+u.best[k+'_n']:'')+'</small></span></button>';});
  const mb=u.best.Mix;
  h+='<button class="opt" data-l="Mix"><b style="width:44px;border-radius:12px">🎲</b><span>Холимог Түвшин<br><small style="color:var(--mute)">30 санамсаргүй асуулт'+(mb!==undefined?' · Сайн оноо: '+mb+'/30':'')+'</small></span></button></div>';
  if(u.hist.length)h+='<h3>Өмнөх түүх</h3>'+u.hist.slice(0,8).map(x=>'<div class="h"><span>'+x.lvl+' ('+(x.m==='g'?'Дүрэм':x.m==='v'?'Үгс':'Бүгд')+') · '+x.s+'/'+x.n+' ('+((x.s/x.n)*100).toFixed(1)+'%)</span><span>Эхэлсэн: '+fmt(x.t0)+'<br>Дууссан: '+fmt(x.t1)+'</span></div>').join('');
  card.innerHTML=h;
  document.getElementById('sw').onclick=profiles;
  const r=document.getElementById('res');if(r)r.onclick=resume;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>selectCategory(b.dataset.l));
}

function selectCategory(l){
  lvl=l;
  card.innerHTML=
   '<div class="center"><h1>Төрөл Сонгох</h1><p class="sub">Түвшин: '+lvl+' ('+LV[lvl]+')</p></div>'+
   '<div class="opts" style="margin-top:20px">'+
   '<button class="opt" id="m_g"><b style="width:44px;border-radius:12px">📚</b><span>Дүрэм (Grammar)<br><small style="color:var(--mute)">Дагнан дүрмийн 30 асуулт</small></span></button>'+
   '<button class="opt" id="m_v"><b style="width:44px;border-radius:12px">🔤</b><span>Үгийн сан (Vocabulary)<br><small style="color:var(--mute)">Дагнан үгийн сангийн 30 асуулт</small></span></button>'+
   '<button class="opt" id="m_all"><b style="width:44px;border-radius:12px">⚡</b><span>Холимог (Бүгд)<br><small style="color:var(--mute)">Дүрэм + Үгийн сан холимог 30 асуулт</small></span></button>'+
   '</div>'+
   '<button class="btn ghost" id="back" style="margin-top:20px">Буцах</button>';
   
  document.getElementById('m_g').onclick=()=>start('g');
  document.getElementById('m_v').onclick=()=>start('v');
  document.getElementById('m_all').onclick=()=>start('all');
  document.getElementById('back').onclick=home;
}

function saveProg(){U().prog={lvl,mode,quiz,i,score,wrong,g,v,t0};saveDB();}
function resume(){const p=U().prog;lvl=p.lvl;mode=p.mode||'all';quiz=p.quiz;N=quiz.length;i=p.i;score=p.score;wrong=p.wrong;g=p.g;v=p.v;t0=p.t0;renderQ();}

function start(m){
  if(m)mode=m;
  let pool = lvl==='Mix'? [].concat(...Object.values(L)) : L[lvl];
  
  if(mode==='g'){
    pool = pool.filter(q=>q[0]==='g');
  }else if(mode==='v'){
    pool = pool.filter(q=>q[0]==='v');
  }
  
  const u = U();
  if(!u.seen) u.seen = [];

  // Өмнө нь ажиллаж байсан болон ажиллаагүй асуултуудыг салгах (Давхцуулахгүй байх алгоритм)
  let unseen = pool.filter(q => !u.seen.includes(q[1]));
  let seen = pool.filter(q => u.seen.includes(q[1]));

  // Эхлээд үзээгүй асуултуудаас авна. Хэрэв хүрэхгүй бол үзсэнээс нэмнэ
  let selected = shuffle(unseen.slice());
  if (selected.length < 30) {
    selected = selected.concat(shuffle(seen.slice())).slice(0, 30);
  } else {
    selected = selected.slice(0, 30);
  }

  quiz = selected.map(q => ({t: q[0], q: q[1], o: shuffle(q[2].slice()), a: q[2][0], e: q[3]}));
  
  // Энэ тестийн асуултуудыг үзсэн түүхэнд бүртгэх
  quiz.forEach(item => {
    if(!u.seen.includes(item.q)) u.seen.push(item.q);
  });
  // Түүхийг сүүлийн 150 асуултаар хязгаарлах (давтагдах циклийг уян хатан байлгах)
  if(u.seen.length > 150) u.seen = u.seen.slice(-150);

  N=quiz.length;i=0;score=0;wrong=[];g=[0,0];v=[0,0];t0=Date.now();
  saveProg();renderQ();
}

function renderQ(){
  answered=false;
  const q=quiz[i],pct=Math.round((i+1)/N*100),prev=Math.round(i/N*100);
  card.innerHTML=
   '<div class="top"><span>Асуулт '+(i+1)+'/'+N+'</span><span>'+pct+'%</span></div>'+
   '<div class="bar"><i id="fill" style="width:'+prev+'%"></i></div>'+
   '<div class="meta"><span class="chip">'+lvl+' · '+TN[q.t]+'</span><span>Оноо: <b id="sc">'+score+'</b></span></div>'+
   '<h2 class="q">'+q.q+'</h2>'+
   '<div class="opts">'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'"><b>'+'ABCD'[k]+'</b><span>'+o+'</span></button>').join('')+'</div>'+
   '<div id="fb"></div><div id="nx"></div>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=document.getElementById('fill');if(f)f.style.width=pct+'%';}));
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}

function pick(k){
  if(answered)return;
  answered=true;
  const q=quiz[i],btns=card.querySelectorAll('.opt'),ok=q.o[k]===q.a,s=q.t==='g'?g:v;
  s[1]++;
  btns.forEach((b,n)=>{b.disabled=true;if(q.o[n]===q.a)b.classList.add('ok');});
  if(ok){
    score++;s[0]++;
  }else{
    btns[k].classList.add('bad');
    wrong.push({q:q.q,mine:q.o[k],a:q.a,e:q.e});
  }
  document.getElementById('sc').textContent=score;
  
  document.getElementById('fb').innerHTML=ok
   ?'<div class="fb ok"><strong>✓ Зөв хариуллаа!</strong>'+q.e+'</div>'
   :'<div class="fb bad"><strong>✗ Буруу хариуллаа!</strong>Таны сонгосон: <b>'+q.o[k]+'</b><br>Зөв хариулт: <b>'+q.a+'</b><br><br><b>Тайлбар:</b> '+q.e+'</div>';
   
  document.getElementById('nx').innerHTML='<button class="btn" id="next">'+(i===N-1?'Үр дүн харах':'Дараах')+'</button>';
  
  const nxt = document.getElementById('next');
  nxt.onclick=next;
  nxt.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next(){if(!answered)return;i++;if(i>=N)finish();else{saveProg();renderQ();}}

function finish(){
  const pctFloat = (score / N) * 100;
  const pct = pctFloat.toFixed(1);
  
  const lv=pctFloat>=90?['Онц сайн','#16a34a']:pctFloat>=70?['Сайн','#2563eb']:pctFloat>=50?['Дунджаар','#d97706']:['Дахин давтах шаардлагатай','#dc2626'];
  {
    const u=U();
    const key=lvl+'_'+mode;
    if(u.best[key]===undefined||score>u.best[key]){u.best[key]=score;u.best[lvl]=score;u.best[lvl+'_n']=N;}
    u.hist.unshift({lvl,m:mode,s:score,n:N,t0,t1:Date.now()});
    u.hist=u.hist.slice(0,30);u.prog=null;saveDB();
  }
  const C=2*Math.PI*72;
  const modeText = mode==='g'?'Дүрэм':mode==='v'?'Үгийн сан':'Холимог';
  
  card.innerHTML=
   '<div class="center"><h1>Тест Дууслаа!</h1><p class="sub">Түвшин: '+lvl+' ('+modeText+')</p>'+
   '<div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><circle class="t" cx="85" cy="85" r="72"/><circle class="f" id="rf" cx="85" cy="85" r="72" stroke="'+lv[1]+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg><div>'+pct+'%<small>'+N+' асуултаас '+score+' зөв</small></div></div>'+
   '<span class="level" style="color:'+lv[1]+'">'+lv[0]+'</span></div>'+
   '<div class="grid"><div class="stat"><b style="color:var(--ok)">'+score+' / '+N+'</b><span>Зөв хариулсан</span></div><div class="stat"><b style="color:var(--bad)">'+(N-score)+' / '+N+'</b><span>Буруу хариулсан</span></div>'+
   '<div class="stat"><b>'+g[0]+'/'+g[1]+'</b><span>Дүрэм (Grammar)</span></div><div class="stat"><b>'+v[0]+'/'+v[1]+'</b><span>Үгийн сан (Vocab)</span></div></div>'+
   (wrong.length?'<h3>Алдаагаа засах: Буруу хариулсан асуултууд</h3>'+wrong.map(w=>'<div class="miss"><p>'+w.q+'</p><span class="r">Таны хариулт: '+w.mine+'</span><br><span class="g">Зөв хариулт: '+w.a+'</span><em><b>Яагаад?</b> '+w.e+'</em></div>').join(''):'<h3 class="center">100% Гүйцэтгэл! Баяр хүргэе! 🎉</h3>')+
   '<button class="btn" id="again">Дахин ажиллах</button><button class="btn ghost" id="lvls">Түвшин солих</button>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('rf').style.strokeDashoffset=C*(1-pctFloat/100);}));
  document.getElementById('again').onclick=()=>{window.scrollTo(0,0);start();};
  document.getElementById('lvls').onclick=()=>{window.scrollTo(0,0);home();};
  window.scrollTo(0,0);
}

// Theme toggle
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('a1theme',r.dataset.theme);}catch(e){}
};
try{const t=localStorage.getItem('a1theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
home();
</script>
</body>
</html>
